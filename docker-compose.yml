services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      OLLAMA_URL: http://ollama:11434
      FRIDAY_DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama
  frontend:
    build: .
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  ollama_models:
